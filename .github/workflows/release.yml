# A tag (v0.2.0) makes a GitHub Release carrying a snapshot of the packs and
# the index — the pinned revision the app repository vendors with
# `tools/sync-packs.sh <tag>`. Pages keeps serving the live index regardless.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/lint.py
      - run: python3 tools/gen_index.py
      - name: Package the snapshot
        run: tar czf "packs-${GITHUB_REF_NAME}.tar.gz" index.json featured.yaml tiers.yaml packs
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "packs-${GITHUB_REF_NAME}.tar.gz" index.json \
            --title "$GITHUB_REF_NAME" \
            --notes "Snapshot of the template packs at $GITHUB_REF_NAME. The app repository vendors it with \`tools/sync-packs.sh $GITHUB_REF_NAME\`; users get packs from the live index, not from here."
