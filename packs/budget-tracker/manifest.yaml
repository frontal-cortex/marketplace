format: 1
id: budget-tracker
name: "Budget Tracker"
version: 2.1.1
kind: collection
summary: "A ledger of transactions, limits per category with spent and remaining computed, bills that advance when you tick paid."
description: |
  Three small databases that stay filled in. `budget` is the ledger: one row per transaction with a date, an amount, a kind (expense, income, transfer), a category and an account; This month and This month by category roll over on the 1st by themselves. `budget-limits` holds one row per category with the monthly amount you mean to spend; the table shows what this month's ledger rows add up to, what is left, the share used as a bar, and last month's figure, and each limit's page charts the category month by month. `budget-bills` is every recurring charge with its cycle and next due date: tick paid and the date moves forward one cycle in the same row; Upcoming, Overdue and a per-month cost list answer what is about to land, what you missed, and what everything costs. Link a transaction to its bill and the bill knows when it was last paid and what it has cost in total. Everything is computed from the rows when you open the page, nothing to update by hand.
tags: [finance, budget, money, database]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "The transactions / limits / bills split and the budget-versus-actual page follow the budget trackers in Notion's gallery (Easlo, Thomas Frank, Matthias Frank) and the envelope spreadsheets they copy; the computed-on-read design is our own."
min_cortex: 0.1.0
collection: budget
collections: [budget-limits, budget-bills]
files:
  - schemas/budget.yaml
  - schemas/budget-limits.yaml
  - schemas/budget-bills.yaml
  - index.md
