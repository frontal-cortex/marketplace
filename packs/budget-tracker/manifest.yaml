format: 1
id: budget-tracker
name: "Budget Tracker"
version: 3.1.0
kind: collection
summary: "A finance dashboard: one-click capture, live balances, budgets with rings, this month at a glance — from one ledger."
description: |
  Five small databases that stay filled in, and a dashboard that reads them. `budget` is the ledger: one row per transaction with a date, an amount, a kind (expense, income, transfer), a category and the account it hit — a transfer names both accounts. Its page is the dashboard: New expense / New income / New transfer buttons, this month's spent, earned and net as tiles, the budgets as cards with a ring each, spending grouped by month with totals, a donut of where the money went, and every account's balance. `accounts` holds one row per account with its opening balance; income, spending, transfers in and out and the balance are computed from the ledger. `budget-limits` holds one row per category with the monthly amount you mean to spend and shows spent, remaining and the share used as a ring. `budget-bills` is every recurring charge with its cycle and next due date: tick paid and the date moves forward one cycle in the same row. `budget-wishlist` is what you are saving up for: tag a transfer with `wish` and the item shows how much is put by and how much is left, tag the purchase and it moves to Bought at what it really cost. Everything is computed from the rows when you open the page; nothing is copied between databases and nothing needs resetting on the 1st.
tags: [finance, budget, money, dashboard, database]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "The dashboard shape — quick-action buttons, budget rings, month-grouped lists, a donut and account balances — follows Sentele's Finance Tracker and Notion's Personal Finance Tracker; the single ledger with transfers as rows and everything computed on read is our own."
min_cortex: 0.1.0
collection: budget
collections: [accounts, budget-limits, budget-bills, budget-wishlist]
