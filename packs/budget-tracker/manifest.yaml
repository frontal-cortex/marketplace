format: 1
id: budget-tracker
name: "Budget Tracker"
version: 4.0.0
kind: collection
summary: "A finance dashboard: quick capture, live account balances, budget rings, over separate expenses, income and transfers."
description: |
  A dashboard page over seven small databases. You log into three of them — `expenses`, `income` and `transfers` — and the rest add up what you logged. An expense has a category and the account it left; an income, its source and the account it arrived in; a transfer, the account it left and the account it landed in, so moving money between your own accounts can never be mistaken for spending. `accounts` holds each account's opening balance, and its income, spending, transfers in and out and current balance are computed from those rows. `categories` holds what you mean to spend per category each month, and shows this month's and last month's spend with the share used as a ring. The dashboard page has New expense / New income / New transfer buttons, the budgets as cards, Expenses, Income and Transfers with their Recent, Weekly, Monthly, Yearly and Chart tabs, a donut of where the money went, and every account's balance. `budget-bills` is every recurring charge — tick paid and the next due date moves forward — and `budget-wishlist` is what you are saving up for: set `wish` on a transfer to put money aside, on the expense that buys it to mark it bought. Everything is computed when you look; nothing is copied between databases and nothing needs resetting on the 1st.
tags: [finance, budget, money, dashboard, database]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "The structure — separate expenses, income, transfers, accounts and categories databases, account balances from two-way relations, budget rings, quick-action buttons and the three-column dashboard — follows Sentele's Finance Tracker. Bills with an advancing due date and the wishlist are our own."
min_cortex: 0.1.0
collection: budget
collections: [expenses, income, transfers, accounts, categories, budget-bills, budget-wishlist]
