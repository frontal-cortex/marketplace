properties:
  - name: kind
    type: select
    options:
      - name: current
        color: blue
      - name: savings
        color: green
      - name: cash
        color: yellow
      - name: credit
        color: red
  # What the account held on the day you started logging here.
  - name: initial
    type: number
    format: currency
  - name: active
    type: checkbox
  # Computed from every row that names this account. None of it is written to
  # a file: add an expense, an income or a transfer and the balance follows.
  - name: income
    type: rollup
    from: income
    relation: account
    property: amount
    function: sum
    format: currency
  - name: spent
    type: rollup
    from: expenses
    relation: account
    property: amount
    function: sum
    format: currency
  - name: moved_in
    type: rollup
    from: transfers
    relation: to_account
    property: amount
    function: sum
    format: currency
  - name: moved_out
    type: rollup
    from: transfers
    relation: from_account
    property: amount
    function: sum
    format: currency
  - name: balance
    type: formula
    expr: coalesce(initial, 0) + coalesce(income, 0) - coalesce(spent, 0) + coalesce(moved_in, 0) - coalesce(moved_out, 0)
    format: currency
  - name: this_month
    type: rollup
    from: expenses
    relation: account
    property: amount
    function: sum
    where: date >= @month
    format: currency
