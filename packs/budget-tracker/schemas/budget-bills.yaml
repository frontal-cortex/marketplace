properties:
  - name: amount
    type: number
    format: currency
  # `repeat` is the cycle the app understands: tick `paid` and `next_due`
  # moves forward by it (`repeat_mode: advance` keeps it the same row).
  - name: repeat
    type: select
    options:
      - name: weekly
        color: yellow
      - name: monthly
        color: blue
      - name: quarterly
        color: green
      - name: yearly
        color: purple
  - name: repeat_mode
    type: select
    options:
      - name: advance
        color: gray
  - name: next_due
    type: date
  - name: paid
    type: checkbox
  - name: category
    type: select
    options:
      - name: housing
        color: blue
      - name: utilities
        color: brown
      - name: subscriptions
        color: purple
      - name: transport
        color: gray
      - name: health
        color: green
      - name: savings
        color: green
      - name: other
        color: gray
  - name: account
    type: relation
    collection: accounts
  - name: active
    type: checkbox
  - name: url
    type: url
  # Computed on read from the ledger rows whose `bill` points here.
  - name: last_paid
    type: rollup
    from: budget
    relation: bill
    function: max
    property: date
  - name: total_paid
    type: rollup
    from: budget
    relation: bill
    function: sum
    property: amount
    format: currency
  - name: monthly
    type: formula
    expr: round(if(repeat == 'weekly', amount * 52 / 12, if(repeat == 'monthly', amount, if(repeat == 'quarterly', amount / 3, amount / 12))), 2)
    format: currency
  - name: due_in
    type: formula
    expr: days_until(next_due)
    format: integer
