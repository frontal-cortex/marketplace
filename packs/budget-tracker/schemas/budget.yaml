properties:
  - name: date
    type: date
  - name: amount
    type: number
    format: currency
  - name: kind
    type: select
    options:
      - name: expense
        color: red
      - name: income
        color: green
      - name: transfer
        color: gray
  - name: category
    type: select
    options:
      - name: housing
        color: blue
      - name: groceries
        color: yellow
      - name: dining
        color: orange
      - name: transport
        color: gray
      - name: utilities
        color: brown
      - name: health
        color: green
      - name: subscriptions
        color: purple
      - name: shopping
        color: pink
      - name: leisure
        color: red
      - name: travel
        color: blue
      - name: education
        color: purple
      - name: gifts
        color: pink
      - name: savings
        color: green
      - name: income
        color: green
      - name: other
        color: gray
  # The account the money left (or arrived in, for income). A row in the
  # `accounts` collection; its balance is computed from these rows.
  - name: account
    type: relation
    collection: accounts
  # Transfers only: the account the money arrived in.
  - name: to_account
    type: relation
    collection: accounts
  - name: payee
    type: text
  - name: bill
    type: relation
    collection: budget-bills
