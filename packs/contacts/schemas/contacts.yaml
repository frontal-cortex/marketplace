properties:
  - name: relationship
    type: select
    options:
      - name: family
        color: pink
      - name: friend
        color: green
      - name: colleague
        color: blue
      - name: client
        color: purple
      - name: mentor
        color: yellow
      - name: community
        color: orange
      - name: acquaintance
        color: gray
  - name: cadence
    type: select
    options:
      - name: monthly
        color: red
      - name: quarterly
        color: orange
      - name: twice a year
        color: yellow
      - name: yearly
        color: blue
      - name: as needed
        color: gray
  - name: company
    type: text
  - name: role
    type: text
  - name: email
    type: text
  - name: phone
    type: text
  - name: location
    type: text
  - name: website
    type: url
  - name: birthday
    type: date
  - name: last_contact
    type: date
  - name: last_seen
    type: rollup
    from: interactions
    relation: people
    property: date
    function: max
  - name: quiet_days
    type: formula
    expr: min(days_since(last_seen), days_since(last_contact))
    format: integer
  - name: due_in
    type: formula
    expr: if(cadence == 'monthly', 30, if(cadence == 'quarterly', 91, if(cadence == 'twice a year', 182, if(cadence == 'yearly', 365, empty)))) - quiet_days
    format: integer
  - name: follow_up
    type: date
  - name: archived
    type: checkbox
