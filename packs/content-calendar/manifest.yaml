format: 1
id: content-calendar
name: "Content Calendar"
version: 2.0.0
kind: collection
summary: "Every piece of content from idea to published: pipeline board, publish calendar, a queue, campaigns, a monthly chart."
description: |
  One row per piece of content — the row is the draft. `status` carries it from idea through drafting, review and scheduled to published; `channel` and `format` say where and what; `due` is the draft deadline and `publish` the day it goes out. The Pipeline board is the flow, the Calendar is the month, the Queue is what is next in publish order, Ideas is the inbox, and a bar chart counts what actually shipped per month, one bar per channel. Campaigns are a second collection: a launch or a series with its own page that shows its pieces as a live board. Each piece's page carries a brief, an outline, the draft, a publish checklist and a table of what was repurposed from it.
tags: [writing, content, marketing, creator, database]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "Shaped by the content and editorial calendars in Notion's gallery (Notion's own Content Calendar and Social Media Calendar, Easlo's Content Calendar, Thomas Frank's Creator's Companion) and by Bases-driven calendars in the Obsidian community."
min_cortex: 0.1.0
collection: content
collections: [campaigns]
files:
