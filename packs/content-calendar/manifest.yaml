format: 1
id: content-calendar
name: "Content Calendar"
version: 2.1.1
kind: collection
summary: "Content from idea to published: pipeline board, calendar, this week, overdue, a queue with days left, campaigns, chart."
description: |
  One row per piece of content — the row is the draft. `status` carries it from idea through drafting, review and scheduled to published; `channel` and `format` say where and what; `due` is the draft deadline and `publish` the day it goes out, with `days_left` counted down for you and `published_on` stamped when it ships. The Pipeline board is the flow, the Calendar is the month, This week is Monday to Sunday, Overdue is every draft past its deadline, the Queue is what is next in publish order, Ideas is the inbox with the high priority ones on top, and a bar chart counts what shipped per month, one bar per channel. A newsletter or episode with `repeat: weekly` comes back on its own once published. Campaigns are a second collection: a launch or a series with a start and an end on a timeline, counting its pieces and how many have shipped, with its own page that shows them as a live board and schedule. Each piece's page carries a brief, an outline, the draft, a publish checklist and a table of what was repurposed from it.
tags: [writing, content, marketing, creator, database]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "Shaped by the content and editorial calendars in Notion's gallery (Notion's own Content Calendar and Social Media Calendar, Easlo's Content Calendar, Thomas Frank's Creator's Companion) and by Bases-driven calendars in the Obsidian community."
min_cortex: 0.1.0
collection: content
collections: [campaigns]
