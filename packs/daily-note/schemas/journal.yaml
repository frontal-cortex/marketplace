properties:
  - name: date
    type: date
  - name: mood
    type: select
    options:
      - name: great
        color: green
      - name: good
        color: blue
      - name: okay
        color: yellow
      - name: low
        color: orange
      - name: rough
        color: red
  - name: energy
    type: number
    format: stars
    max: 5
  - name: sleep
    type: number
    format: decimal
    unit: "h"
  - name: areas
    type: multi_select
    options:
      - name: work
        color: blue
      - name: health
        color: green
      - name: family
        color: pink
      - name: friends
        color: orange
      - name: learning
        color: purple
      - name: creative
        color: yellow
      - name: money
        color: brown
      - name: rest
        color: gray
  - name: highlight
    type: text
  # The week this day belongs to: the row in Weekly Review (collections/weeks),
  # by title. The row template fills it with "Week of <this Monday>"; Weekly
  # Review counts and averages days through it. Harmless when that pack is not
  # installed.
  - name: week
    type: relation
    collection: weeks
