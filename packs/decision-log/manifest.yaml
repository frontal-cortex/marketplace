format: 1
id: decision-log
name: "Decision Log"
version: 2.1.1
kind: collection
summary: "One row per decision: context, options, what was chosen and why, a review date that comes due by itself, the outcome."
description: |
  A decisions database rather than a loose note. Each row carries `status` (proposed, accepted, rejected, deprecated, superseded), an `area`, its `impact` and whether it is `reversible`, your `confidence` at the time and, once you have looked back, the `outcome`. The dates take care of themselves: `decided` is stamped the day a row is accepted, `reviewed` the day you set an outcome, and `days_to_review` counts down to the `review` date you chose. The row's page is the record: context and state of mind, the options with their good and bad points, the decision and the one reason that carried it, what you expect to happen, the consequences, and a review section you fill in on the review date. A `supersedes` relation links a new decision to the one it replaces, and the old row's `superseded_by` fills in on its own. Views: Log, Board by status, Due for review (the next thirty days and anything overdue), a Timeline from decided to review, Outcomes by month and a Calibration chart of outcomes by the confidence you wrote down. Works for a team's architecture decisions and for one person's life ones.
