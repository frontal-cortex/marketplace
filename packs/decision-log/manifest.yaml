format: 1
id: decision-log
name: "Decision Log"
version: 2.0.0
kind: collection
summary: "One row per decision: context, options, what was chosen and why, a review date, and later the outcome you got."
description: |
  A decisions database rather than a loose note. Each row carries `status` (proposed, accepted, rejected, deprecated, superseded), the date it was `decided`, a `review` date, an `area`, its `impact` and whether it is `reversible`, your `confidence` at the time and, once you have looked back, the `outcome`. The row's page is the record: context and state of mind, the options with their good and bad points, the decision and the one reason that carried it, what you expect to happen, the consequences, and a review section you fill in on the review date. A `supersedes` relation links a new decision to the one it replaces, and the old page shows what superseded it. Views: Log, Board by status, Due for review, a calendar of review dates and a chart of outcomes by month. Works for a team's architecture decisions and for one person's life ones.
tags: [work, decisions, thinking, database]
