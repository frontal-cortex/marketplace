properties:
  - name: status
    type: status
    options:
      - name: proposed
        color: yellow
      - name: accepted
        color: green
      - name: rejected
        color: gray
      - name: deprecated
        color: brown
      - name: superseded
        color: purple
  - name: decided
    type: date
    auto: status == accepted or status == rejected
  - name: review
    type: date
  - name: days_to_review
    type: formula
    expr: days_until(review)
    format: integer
  - name: reviewed
    type: date
    auto: outcome == as_expected or outcome == better or outcome == worse or outcome == unclear
  - name: area
    type: select
    options:
      - name: engineering
        color: gray
      - name: product
        color: purple
      - name: team
        color: blue
      - name: money
        color: green
      - name: personal
        color: pink
      - name: other
        color: brown
  - name: impact
    type: select
    options:
      - name: low
        color: gray
      - name: medium
        color: yellow
      - name: high
        color: red
  - name: reversible
    type: checkbox
  - name: confidence
    type: number
    format: percent
  - name: confidence_band
    type: formula
    expr: round(confidence / 10, 0) * 10
    format: percent
  - name: owner
    type: person
  - name: outcome
    type: select
    options:
      - name: pending
        color: gray
      - name: as_expected
        color: green
      - name: better
        color: blue
      - name: worse
        color: red
      - name: unclear
        color: yellow
  - name: supersedes
    type: relation
    collection: decisions
  - name: superseded_by
    type: relation
    from: decisions
    relation: supersedes
  - name: link
    type: url
