id: goals
name: "Goals"
version: 1.0.0
kind: collection
summary: "Goals with a status, a life area, a target date and a progress number — board by status, calendar of target dates."
description: |
  Quarterly or yearly goals as rows, each with the area of life it belongs to, a status that says whether it is on track, a target date the calendar shows, and a progress percentage you update when you review. Each goal is a note, so the why, the milestones and the review log live under its properties. Pairs with Weekly Review.
