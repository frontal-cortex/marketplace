format: 1
id: goals
name: "Goals"
version: 2.0.0
kind: collection
summary: "Goals with milestones and dated check-ins; each goal's page charts its own progress, the board shows which are drifting."
description: |
  Three databases. `goals` is one row per goal with its life area, timeframe (year, quarter, month), priority, start and target dates, a one-line measure of done, and a status that says planned, on track, at risk, off track, done or dropped. `goal-milestones` breaks a goal into dated steps with their own status board and calendar. `goal-checkins` is the review log: one short row per check-in with the date, the progress number and your confidence, so progress is a line over time instead of a number you overwrite. Open a goal and its page lists its milestones, charts its check-ins and keeps the why, the plan and the obstacles under them.
tags: [productivity, goals, planning, okr, database]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "Goals / milestones / check-ins follows the goal trackers in Notion's gallery (Benny Builds It, Jithin Rajiv, Easlo, Thomas Frank's Ultimate Brain) and the OKR check-in habit; the per-goal progress chart is our own."
min_cortex: 0.1.0
