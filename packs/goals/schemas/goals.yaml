properties:
  - name: status
    type: status
    options:
      - name: planned
        color: gray
      - name: on_track
        color: green
      - name: at_risk
        color: yellow
      - name: off_track
        color: red
      - name: done
        color: blue
      - name: dropped
        color: gray
  - name: area
    type: select
    options:
      - name: health
        color: green
      - name: career
        color: blue
      - name: money
        color: yellow
      - name: learning
        color: purple
      - name: relationships
        color: pink
      - name: home
        color: brown
      - name: creative
        color: orange
      - name: community
        color: gray
  - name: timeframe
    type: select
    options:
      - name: year
        color: purple
      - name: quarter
        color: blue
      - name: month
        color: green
      - name: someday
        color: gray
  - name: priority
    type: select
    options:
      - name: high
        color: red
      - name: medium
        color: yellow
      - name: low
        color: gray
  - name: start
    type: date
  - name: target
    type: date
  - name: completed
    type: date
    auto: status == done
  - name: measure
    type: text
  # Computed on read from the check-ins and milestones that point at this
  # goal. None of these is written to a file.
  - name: progress
    type: rollup
    from: goal-checkins
    relation: goal
    function: max
    property: progress
    format: progress
  - name: last_checkin
    type: rollup
    from: goal-checkins
    relation: goal
    function: max
    property: date
  - name: milestones_done
    type: rollup
    from: goal-milestones
    relation: goal
    function: percent
    where: status == 'done'
    format: percent
  - name: next_milestone
    type: rollup
    from: goal-milestones
    relation: goal
    function: min
    property: due
    where: status != 'done'
  - name: days_left
    type: formula
    expr: days_until(target)
    format: integer
