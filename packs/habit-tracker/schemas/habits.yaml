properties:
  - name: category
    type: select
    options:
      - name: health
        color: green
      - name: mind
        color: blue
      - name: work
        color: yellow
      - name: home
        color: brown
  - name: frequency
    type: select
    options:
      - name: daily
        color: gray
      - name: weekdays
        color: gray
      - name: weekly
        color: gray
      - name: custom
        color: gray
  - name: target
    type: number
  - name: start
    type: date
  - name: archived
    type: checkbox
