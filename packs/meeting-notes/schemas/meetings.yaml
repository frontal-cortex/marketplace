properties:
  - name: date
    type: date
  - name: kind
    type: select
    options:
      - name: standup
        color: gray
      - name: team
        color: blue
      - name: project
        color: green
      - name: client
        color: orange
      - name: planning
        color: purple
      - name: retro
        color: yellow
      - name: interview
        color: pink
      - name: other
        color: brown
  - name: status
    type: status
    options:
      - name: scheduled
        color: gray
      - name: held
        color: blue
      - name: cancelled
        color: red
      - name: followed-up
        color: green
  - name: repeat
    type: select
    options:
      - name: weekly
        color: blue
      - name: biweekly
        color: blue
      - name: monthly
        color: blue
      - name: quarterly
        color: blue
  - name: attendees
    type: person
  - name: project
    type: text
  - name: summary
    type: text
  - name: link
    type: url
  - name: open_items
    type: rollup
    from: action-items
    relation: meeting
    function: count
    where: status != 'done' and status != 'dropped'
    format: integer
  - name: progress
    type: rollup
    from: action-items
    relation: meeting
    function: percent
    where: status == 'done' or status == 'dropped'
    format: progress
