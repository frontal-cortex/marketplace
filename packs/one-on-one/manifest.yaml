format: 1
id: one-on-one
name: "1:1 Notes"
version: 2.1.0
kind: collection
summary: "A page per person with a running agenda, one row per 1:1, and the follow-ups from all of them in one list."
description: |
  Three small databases that fit together. `collections/people/` is one page per person you meet regularly: role, cadence, current focus, a topics list that carries from one meeting to the next, and live tables of their 1:1s and open follow-ups. The engine adds the numbers you would otherwise look up — when you last met, the next 1:1 on the books, how many you have held in ninety days, how many promises are open — and a `due` flag that compares the gap since you last met with the person's cadence, so Due is the list to book from and Weekly is a tracker of the weekly people against the 1:1s list. `collections/one-on-ones/` is one row per meeting — date, person, mood, one-line summary, an optional `repeat` that brings a standing 1:1 back when it is held — with a page shaped for the conversation: their topics, yours, since last time, wins, blockers, growth, feedback, follow-ups. `collections/follow-ups/` holds what each of you promised, with an owner, a due date, the days left and a stamped `completed` date, so what you owe, what you are owed and what is overdue are views rather than a search. Charts on the 1:1s page count meetings per week by mood and per month by person.
tags: [work, people, meetings, management, database]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "Sections follow Notion's own one-on-one template (past week, this week, blockers, action items) and Dann Berg's people-note pattern for Obsidian; the person page as the durable record with per-meeting notes underneath is the shape every manager's guide converges on."
min_cortex: 0.1.0
collection: people
collections: [one-on-ones, follow-ups]
