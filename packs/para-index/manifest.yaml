format: 1
id: para-index
name: "PARA Index"
version: 2.0.0
kind: collection
summary: "Projects, Areas and Resources as three linked databases; archive is a status, and an index note shows it all live."
description: |
  The PARA method as databases instead of folders. Areas are the ongoing responsibilities (Health, Finances, Career) with a standard to keep and a review date; Projects have an outcome, a deadline and the area they serve; Resources are the articles, books and tools you keep, tied to the area or project they are for. Nothing is ever moved to an Archive folder — a project is `done` or `dropped`, an area or resource is `archived`, and the Archive views filter on that, so relations and history survive. Each area's page lists its own active projects and resources; each project's page lists its resources and next actions. The `Second Brain` note template is the one-page index: active projects, areas, recent resources and the archive, all live.
tags: [second-brain, para, projects, areas, resources, database]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "The PARA method by Tiago Forte (Building a Second Brain). Archive-as-a-status and the area page that lists its own projects and resources come from the PARA templates in Notion's gallery, notably Thomas Frank's and Notion Mastery's."
min_cortex: 0.1.0
