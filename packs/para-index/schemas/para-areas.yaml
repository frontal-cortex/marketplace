properties:
  - name: category
    type: select
    options:
      - name: work
        color: blue
      - name: personal
        color: green
      - name: health
        color: red
      - name: finances
        color: yellow
      - name: home
        color: brown
      - name: learning
        color: purple
      - name: relationships
        color: pink
      - name: creative
        color: orange
  - name: status
    type: status
    options:
      - name: active
        color: green
      - name: paused
        color: yellow
      - name: archived
        color: gray
  - name: standard
    type: text
  - name: review
    type: select
    options:
      - name: weekly
        color: gray
      - name: monthly
        color: blue
      - name: quarterly
        color: purple
  - name: next_review
    type: date
  - name: review_in
    type: formula
    expr: days_until(next_review)
    format: integer
  - name: open_projects
    type: rollup
    from: para-projects
    relation: area
    function: count
    where: status != 'done' and status != 'dropped'
  - name: resources
    type: rollup
    from: para-resources
    relation: area
    function: count
    where: status != 'archived'
