  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "The project tracker that tops Notion's gallery, cut down to the solo version."
min_cortex: 0.1.0
collection: projects
files:
  - templates/projects.md
  - schemas/projects.yaml
  - index.md
  - seed/example-project.md
