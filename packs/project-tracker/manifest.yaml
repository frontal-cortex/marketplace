format: 1
id: project-tracker
name: "Project Tracker"
version: 1.0.0
kind: collection
summary: "A solo-friendly project database: status, priority, deadline, next action."
description: |
  What is the project, what is next, what is stalled. Deliberately four properties, not fifteen: a status board, a priority, a deadline for the calendar, and a single next action so a stalled project is obvious. Pair with Tasks by naming the project in each task's project field.
tags: [work, projects, database]
