format: 1
id: project-tracker
name: "Project Tracker"
version: 2.1.0
kind: collection
summary: "Projects with status, priority, deadline, computed progress and one next action; milestones; a timeline; a page each."
description: |
  One row per project, and a second small collection of milestones — the dated steps a project is made of. A project has a status (planned / active / on_hold / done / dropped), a priority, an `area`, `start` and `deadline` dates and one `next_action` so a stalled project is obvious. The rest is computed: `progress` is the share of its milestones ticked done, `next_milestone` the soonest still open, `days_left` a countdown to the deadline, `open_tasks` a count from the Tasks pack when it is installed, and `completed` is stamped the day status becomes done. Views: Open (what is live, p1 first), Board by status, a Timeline from start to deadline, Due in 30 days, Stalled (active projects with no next action) and Finished per month. Each project's page states the outcome, embeds its own milestones, and — if the Tasks pack is installed — a board of the tasks that name it. Milestones have their own calendar, so every key date across every project is on one page.
tags: [work, projects, database, planning]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "Follows the project databases in Notion's gallery (Notion's Projects & Tasks, Thomas Frank's Ultimate Brain projects, Easlo's Project Tracker); the single next action is from Getting Things Done."
min_cortex: 0.1.0
collection: projects
collections: [milestones]
