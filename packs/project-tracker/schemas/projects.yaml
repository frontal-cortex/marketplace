properties:
  - name: status
    type: status
    options:
      - name: planned
        color: gray
      - name: active
        color: blue
      - name: on_hold
        color: yellow
      - name: done
        color: green
      - name: dropped
        color: red
  - name: priority
    type: select
    options:
      - name: p1
        color: red
      - name: p2
        color: yellow
      - name: p3
        color: gray
  - name: area
    type: select
    options:
      - name: work
        color: blue
      - name: personal
        color: green
      - name: home
        color: brown
      - name: health
        color: pink
      - name: learning
        color: purple
      - name: side_project
        color: orange
  - name: start
    type: date
  - name: deadline
    type: date
  - name: completed
    type: date
  - name: progress
    type: number
  - name: next_action
    type: text
