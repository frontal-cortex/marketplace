format: 1
id: reading-list
name: "Reading List"
version: 2.1.0
kind: collection
summary: "Books, articles and papers as rows with a note each, a progress bar per book, and an optional log of sittings."
description: |
  One row per thing you read — book, ebook, audiobook, article or paper — with author, status, format, genre, a star rating, page count, who recommended it and when you started and finished. `started` and `finished` stamp themselves when `status` moves; a `progress` bar is worked out from the pages you have read over the page count. The row's page is the reading note: why you picked it up, the ideas, the quotes, the verdict. A second collection, `reading-log`, holds one small row per sitting (date, book, pages); from those each book sums its `logged` pages and knows its `last_read` day, the Reading list draws a week grid of what you are reading, each book's page a year heatmap, and the log charts pages per week by book. Views: Reading now (with progress and days idle), Shelf by status, Finished (with days to finish), Per month, a Timeline of every book started and This week. The log is optional — the list works without it.
tags: [reading, books, notes, second-brain, database]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "Shaped by the reading trackers in Notion's gallery (Thomas Frank's Books, the Bookworm and Book Tracker templates) and by the Obsidian book-tracking write-ups that keep a list of read dates per book."
min_cortex: 0.1.0
collection: reading
collections: [reading-log]
