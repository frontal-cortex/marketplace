summary: "Books and articles with status, rating and dates; each row is a full reading note."
description: |
  A reading database rather than a loose note: to-read, reading, finished as a board; a rating; started and finished dates. Each row opens into a reading note — why you picked it up, key ideas, quotes worth keeping, how you will use it — so the list and the notes live in one place.
