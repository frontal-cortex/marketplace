properties:
  - name: author
    type: text
  - name: status
    type: status
    options:
      - name: to_read
        color: gray
      - name: up_next
        color: yellow
      - name: reading
        color: blue
      - name: finished
        color: green
      - name: abandoned
        color: red
  - name: format
    type: select
    options:
      - name: book
        color: blue
      - name: ebook
        color: purple
      - name: audiobook
        color: pink
      - name: article
        color: gray
      - name: paper
        color: green
  - name: genre
    type: multi_select
    options:
      - name: fiction
        color: purple
      - name: nonfiction
        color: blue
      - name: science
        color: green
      - name: history
        color: brown
      - name: business
        color: orange
      - name: biography
        color: yellow
      - name: technology
        color: gray
      - name: philosophy
        color: pink
  - name: rating
    type: number
  - name: pages
    type: number
  - name: pages_read
    type: number
  - name: started
    type: date
  - name: finished
    type: date
  - name: source
    type: text
  - name: link
    type: url
