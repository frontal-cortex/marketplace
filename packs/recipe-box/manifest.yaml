format: 1
id: recipe-box
name: "Recipe Box"
version: 2.1.0
kind: collection
summary: "Recipes with cook counts and last-cooked dates, a meal plan for today and this week, a grocery list in aisle order."
description: |
  Three collections that work as one kitchen. Recipes carry course, cuisine, main ingredient, diet, difficulty, prep and cook minutes, servings, a star rating, status and source; total minutes, how often and when the recipe was last cooked, when it is next planned and how many of its grocery items are still to buy are worked out from the other two collections, so Quick dinners, Rotation and To try answer themselves. The ingredients are a checklist and the method a numbered list in the body, and the page ends with a live cook log. Meals are one row per planned meal — a date, a slot, a recipe — with a calendar, a Today list, a This week list and board, and a bar chart of what you cooked per week. Groceries are items with an aisle and a `bought` box: the To buy table is the shopping list in aisle order, the board is the shop.
tags: [food, cooking, meal-planning, database]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "The recipe, meal-plan and grocery trio follows the recipe managers in Notion's gallery (Matthias Frank's meal planner, the Ultimate Home Chef dashboard, the Frugal and Thriving recipe database) and the Recipe Box and Recipe View plugins for Obsidian."
min_cortex: 0.1.0
collection: recipes
collections: [meals, groceries]
