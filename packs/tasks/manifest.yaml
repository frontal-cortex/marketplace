format: 1
id: tasks
name: "Tasks"
version: 2.0.0
kind: collection
summary: "One row per task with status, priority, due date and a Today flag; Inbox, Today, Upcoming, a board and a done chart."
description: |
  The task list most people end up building, done once. Each task is a row with a status (todo / doing / waiting / someday / done), a priority (p1–p3), a `due` date, a `today` checkbox for the short list you actually work from, an `area` and a free-text `project`. The views are the ones to-do apps ship: Inbox for what you captured and have not planned, Today, Upcoming by due date, a board by status, and a chart of tasks finished per week. Each task's page has a "done when" line, a checklist of steps and room for notes. Name the same project in the Project Tracker pack and its page shows these tasks.
tags: [productivity, tasks, database, gtd]
