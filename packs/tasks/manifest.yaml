format: 1
id: tasks
name: "Tasks"
version: 2.1.1
kind: collection
summary: "One row per task with status, priority, due and repeat; Today, This week, Upcoming, Inbox, a board and a done chart."
description: |
  The task list most people end up building, done once. Each task is a row with a status (todo / doing / waiting / someday / done), a priority (p1–p3), a `due` date, an optional `repeat`, an `area` and a free-text `project`. The views are the ones to-do apps ship, and they follow the calendar by themselves: Today (due today or earlier), This week, Upcoming, Inbox for what you captured and have not dated, a board by status, and a chart of tasks finished per week. `completed` is stamped when a task is set to done; a task with `repeat: weekly` comes back with its date moved forward. Each task's page has a "done when" line, a checklist of steps and room for notes. Name the same project in the Project Tracker pack and its page shows these tasks and counts the open ones.
tags: [productivity, tasks, database, gtd]
