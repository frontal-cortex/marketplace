properties:
  - name: status
    type: status
    options:
      - name: todo
        color: gray
      - name: doing
        color: blue
      - name: waiting
        color: yellow
      - name: someday
        color: purple
      - name: done
        color: green
  - name: priority
    type: select
    options:
      - name: p1
        color: red
      - name: p2
        color: yellow
      - name: p3
        color: gray
  - name: due
    type: date
  - name: days_left
    type: formula
    expr: days_until(due)
    format: integer
  - name: completed
    type: date
    auto: status == done
  - name: repeat
    type: text
  - name: area
    type: select
    options:
      - name: work
        color: blue
      - name: personal
        color: green
      - name: home
        color: brown
      - name: health
        color: pink
      - name: learning
        color: purple
      - name: admin
        color: gray
  - name: project
    type: text
