format: 1
id: weekly-review
name: "Weekly Review"
version: 2.1.1
kind: collection
summary: "One row per week: a plan, then the get-clear / get-current review; reviews due, rating and carry-over charted."
description: |
  A weekly review as a database. Each week is a row with a `status` (planned, reviewed, skipped), a `rating` out of ten, a one-line `focus`, the `areas` it touched, a `carried_over` count of what slipped, and a `reviewed_on` date that stamps itself when you mark the week reviewed. The page has two halves: a plan (focus and Top 3) and a review — the Getting Things Done checklist (get clear, get current), then wins, what slipped, lessons, what gave and drained energy, the carried-over list, and next week's three. To review lists every planned week whose Friday has come; a board shows the weeks by status, a calendar puts each on its Monday, and two charts plot the rating and the carry-over count week by week, so a slow decline or a growing backlog is visible. With Daily Note installed, each week also counts the days you wrote and averages their energy and sleep — computed, not copied.
tags: [productivity, review, journal, database]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "The get-clear / get-current / get-creative checklist is David Allen's Weekly Review from Getting Things Done. Weeks as rated rows with monthly trends follows the weekly review databases in Notion's gallery (Thomas Cerulis, Sharky Progress, Simone Smerilli); the plan-then-review page with a carried-over list is the shape of the Vaultorial and Pensio weekly notes for Obsidian; the wins / slipped / energy prompts follow Michelle Mac's."
min_cortex: 0.1.0
